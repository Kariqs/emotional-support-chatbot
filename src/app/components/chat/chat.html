<div class="flex flex-col h-screen">
    <!-- Header -->
    <app-header></app-header>

    <!-- Chat Messages -->
    <div class="flex-1 overflow-y-auto px-4 py-6 space-y-4" #chatContainer>
        @for (message of messages; track $index) {
        <div [ngClass]="message.sender === 'user' ? 'flex justify-end' : 'flex justify-start'">

            <!-- Bot Message -->
            @if (message.sender === 'bot') {
            <div class="flex items-start space-x-2 max-w-[80%]">
                <div
                    class="w-8 h-8 bg-linear-to-br from-purple-500 to-blue-500 rounded-full flex items-center justify-center shrink-0 shadow-lg">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div>
                    <div
                        class="bg-gray-800/90 backdrop-blur-sm border border-gray-700 rounded-2xl rounded-tl-none shadow-lg px-4 py-3">
                        <p class="text-gray-200 text-sm leading-relaxed">{{ message.text }}</p>
                    </div>
                    <p class="text-xs text-gray-500 mt-1 ml-2">{{ formatTime(message.timestamp) }}</p>
                </div>
            </div>
            }

            <!-- User Message -->
            @if (message.sender === 'user') {
            <div class="flex items-end space-x-2 max-w-[80%]">
                <div>
                    <div
                        class="bg-linear-to-r from-purple-600 to-blue-600 rounded-2xl rounded-tr-none shadow-lg px-4 py-3 border border-purple-500/30">
                        <p class="text-white text-sm leading-relaxed">{{ message.text }}</p>
                    </div>
                    <p class="text-xs text-gray-500 mt-1 mr-2 text-right">{{ formatTime(message.timestamp) }}</p>
                </div>
            </div>
            }
        </div>
        }

        <!-- Typing Indicator -->
        @if (isTyping) {
        <div class="flex items-start space-x-2">
            <div
                class="w-8 h-8 bg-linear-to-br from-purple-500 to-blue-500 rounded-full flex items-center justify-center shadow-lg">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <div
                class="bg-gray-800/90 backdrop-blur-sm border border-gray-700 rounded-2xl rounded-tl-none shadow-lg px-4 py-3">
                <div class="flex space-x-1">
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
                </div>
            </div>
        </div>
        }

        <!-- Error Message -->
        @if (errorMessage) {
        <div class="flex justify-center">
            <div class="bg-red-900/50 border border-red-700 rounded-lg px-4 py-2 max-w-md">
                <p class="text-red-200 text-sm text-center">{{ errorMessage }}</p>
            </div>
        </div>
        }
    </div>

    <!-- Input Area -->
    <div class="bg-gray-900/80 backdrop-blur-sm border-t border-gray-800 px-4 py-3">
        <div class="flex items-center space-x-2">
            <div class="flex-1 relative">
                <input type="text" [(ngModel)]="inputMessage" (keyup.enter)="sendMessage()" [disabled]="isTyping"
                    placeholder="Share what's on your mind..."
                    class="w-full bg-gray-800/50 border border-gray-700 rounded-full px-5 py-3 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all disabled:opacity-50 disabled:cursor-not-allowed" />
            </div>
            <button (click)="sendMessage()" [disabled]="!inputMessage.trim() || isTyping"
                class="w-11 h-11 bg-linear-to-r from-purple-600 to-blue-600 rounded-full flex items-center justify-center shadow-lg hover:shadow-purple-500/50 hover:scale-105 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
                @if (!isTyping) {
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
                }
                @if (isTyping) {
                <svg class="w-5 h-5 text-white animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                }
            </button>
        </div>
    </div>
</div>
