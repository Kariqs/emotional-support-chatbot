<div class="min-h-screen flex items-center justify-center px-4 py-8"
    style="padding-top: max(2rem, env(safe-area-inset-top)); padding-bottom: max(2rem, env(safe-area-inset-bottom));">
    <!-- 404 Card -->
    <div class="w-full max-w-lg text-center">

        <!-- Animated 404 -->
        <div class="mb-8">
            <h1
                class="text-9xl font-bold bg-linear-to-r from-purple-500 via-purple-400 to-blue-500 bg-clip-text text-transparent animate-pulse">
                404
            </h1>
        </div>

        <!-- Icon -->
        <div class="flex justify-center mb-6">
            <div
                class="w-24 h-24 bg-linear-to-br from-purple-500 to-blue-500 rounded-full flex items-center justify-center shadow-2xl shadow-purple-500/50 animate-float">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
        </div>

        <!-- Emojis -->
        <div class="flex justify-center gap-4 mb-6">
            <div class="text-5xl animate-swing" style="animation-delay: 0s;">
                😕
            </div>
            <div class="text-5xl animate-swing-vertical" style="animation-delay: 0.3s;">
                🔍
            </div>
        </div>

        <!-- Message -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-100 mb-3">
                Page Not Found
            </h2>
            <p class="text-gray-400 text-md mb-2">
                Oops!The page you are looking for couldn't be found or maybe it hasn't been implemented.
            </p>
            <p class="text-gray-500 text-xs">
                Don't worry, you're not lost. Let's get you back on track.
            </p>
        </div>

        <!-- Suggestions Box -->
        <div class="bg-gray-800/90 backdrop-blur-sm border border-gray-700 rounded-2xl p-6 mb-8">
            <h3 class="text-lg font-semibold text-gray-200 mb-4">Maybe you were looking for:</h3>
            <div class="space-y-3">
                <a routerLink="/chat"
                    class="flex items-center justify-between px-4 py-3 bg-gray-700/50 hover:bg-gray-700 rounded-xl transition-all group">
                    <div class="flex items-center space-x-3">
                        <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        <span class="text-gray-300 group-hover:text-gray-100">Chat with MindHealthAI</span>
                    </div>
                    <svg class="w-5 h-5 text-gray-500 group-hover:text-purple-400" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </a>

                <a routerLink="/"
                    class="flex items-center justify-between px-4 py-3 bg-gray-700/50 hover:bg-gray-700 rounded-xl transition-all group">
                    <div class="flex items-center space-x-3">
                        <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                        <span class="text-gray-300 group-hover:text-gray-100">Go to Home</span>
                    </div>
                    <svg class="w-5 h-5 text-gray-500 group-hover:text-purple-400" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </a>
            </div>
        </div>

        <!-- Back Button -->
        <button onclick="history.back()" class="w-full sm:w-auto px-8 py-4 bg-linear-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 
            text-white font-bold rounded-xl uppercase tracking-wider text-sm
            transition-all duration-300 hover:scale-105 active:scale-95
            shadow-lg shadow-purple-500/50 hover:shadow-purple-500/70">
            Go Back
        </button>

        <!-- Support Text -->
        <p class="text-gray-500 text-sm mt-6">
            Need help?
            <a href="#" class="text-purple-400 hover:text-purple-300 underline ml-1">Contact Support</a>
        </p>
    </div>
</div>
